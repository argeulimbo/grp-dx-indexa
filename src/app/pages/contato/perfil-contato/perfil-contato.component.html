<!-- Container Principal -->
<div class="content-block dx-card responsive-paddings">

  <!-- Cabecalho e Bt Voltar -->
  <section class="cabecalho-link" id="cabecalho-link">
    <img src="/assets/logo.png">
      <dx-button
      class="seta"
      icon="arrowleft"
      text="Voltar"
      routerLink="/lista-contatos"
      ></dx-button>
  </section>

  <section class="cabecalho-contato">
    <img src="/assets/perfil-contato.png">
    <h1>Perfil do Contato</h1>
  </section>
  <!-- Fim do Cabecalho -->

  <!-- Perfil Card -->
  <section class="perfil">
    <ul>
      <li>
        <span class="dx-icon-card"></span>
        <strong>Nome</strong>
      </li>
      <li>{{ contato.nome }}</li>

      <li>
        <span class="dx-icon-tel"></span>
        <strong>Telefone</strong>
      </li>
      <li>{{ contato.telefone }}</li>
      <li>
        <span class="dx-icon-email"></span>
        <strong>Email</strong>
      </li>
      <li>{{ contato.email }}</li>
      <li>
        <span class="dx-icon-event"></span>
        <strong>Data de nascimento</strong>
      </li>
      <li>{{ contato.aniversario }}</li>
      <li>
        <span class="dx-icon-mention"></span>
        <strong>Redes sociais</strong>
      </li>
      <li>{{ contato.redes }}</li>
    </ul>

    <!-- Buttons -->
     <div class="botoes">
      <dx-button
      class="botao-excluir"
      (click)="excluir()"
      text="Excluir Contato"
      ></dx-button>
     </div>
  </section>


</div>
